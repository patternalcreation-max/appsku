name: k3-calculator

options:
  bundleIdPrefix: com.k3
  deploymentTarget:
    iOS: "16.0"

targets:
  k3-calculator:
    type: application
    platform: iOS
    sources:
      - Calculator
    settings:
      base:
        PRODUCT_NAME: K3 Calculator
        PRODUCT_BUNDLE_IDENTIFIER: com.k3.calculator
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: NO
