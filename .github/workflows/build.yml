name: Build IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build (unsigned, no archive)
        run: |
          xcodebuild build \
            -project k3-calculator.xcodeproj \
            -scheme k3-calculator \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            SWIFT_OPTIMIZATION_LEVEL=-Onone \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=NO

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -1)
          echo "Found: $APP_PATH"
          echo "=== App contents ==="
          ls -la "$APP_PATH"
          echo "=== Info.plist ==="
          plutil -p "$APP_PATH/Info.plist"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -ry k3-calculator.ipa Payload
          cd ..
          echo "=== IPA size ==="
          ls -la build/k3-calculator.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: k3-calculator-ipa
          path: build/k3-calculator.ipa
          retention-days: 90

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: |
            build/Build/Products
          retention-days: 7

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: build/k3-calculator.ipa
          generate_release_notes: true
