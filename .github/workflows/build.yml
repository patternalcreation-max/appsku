name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build .app (unsigned)
        run: |
          xcodebuild build \
            -project k3-calculator.xcodeproj \
            -scheme k3-calculator \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/Build/Products -name "k3-calculator.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r k3-calculator.ipa Payload
          cd ..
          ls -la build/k3-calculator.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: k3-calculator-ipa
          path: build/k3-calculator.ipa
          retention-days: 90

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/k3-calculator.ipa
          generate_release_notes: true
