name: Build IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive
        run: |
          xcodebuild archive \
            -project k3-calculator.xcodeproj \
            -scheme k3-calculator \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/k3-calculator.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_BITCODE=NO \
            ARCHS=arm64

      - name: Inspect and Package IPA
        run: |
          APP="build/k3-calculator.xcarchive/Products/Applications/k3-calculator.app"
          echo "=== App bundle contents ==="
          ls -laR "$APP"
          echo ""
          echo "=== Info.plist ==="
          plutil -p "$APP/Info.plist"
          
          mkdir -p build/Payload
          cp -r "$APP" build/Payload/
          cd build
          zip -ry k3-calculator.ipa Payload
          cd ..
          echo "=== Final IPA ==="
          ls -la build/k3-calculator.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: k3-calculator-ipa
          path: build/k3-calculator.ipa
          retention-days: 90

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: build/k3-calculator.ipa
          generate_release_notes: true
