name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive
        run: |
          xcodebuild archive \
            -project k3-calculator.xcodeproj \
            -scheme k3-calculator \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/k3-calculator.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Export IPA (unsigned)
        run: |
          # Since we build unsigned, we extract the .app from the archive and package manually
          mkdir -p build/Payload
          cp -r build/k3-calculator.xcarchive/Products/Applications/k3-calculator.app build/Payload/
          cd build
          zip -r k3-calculator.ipa Payload
          cd ..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: k3-calculator-ipa
          path: build/k3-calculator.ipa
          retention-days: 90

      - name: Upload to GitHub Releases (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/k3-calculator.ipa
          generate_release_notes: true
