name: Build MetaCalendar IPA

on:
  push:
    branches: [main]
    paths:
      - 'MetaCalendar/**'
      - '.github/workflows/build-metacalendar.yml'
    tags: ['metacalendar-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s $(ls -d /Applications/Xcode*.app | head -1)
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: MetaCalendar
        run: xcodegen generate 2>&1

      - name: Build .app (unsigned)
        id: build
        working-directory: MetaCalendar
        run: |
          set +e
          xcodebuild build             -project MetaCalendar.xcodeproj             -scheme MetaCalendar             -sdk iphoneos             -configuration Release             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             DEVELOPMENT_TEAM="" 2>&1 | tee build_output.log
          EXIT_CODE=${PIPESTATUS[0]}
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "BUILD_FAILED=true" >> $GITHUB_OUTPUT
            
            # Extract errors and create annotations
            echo "=== SWIFT COMPILER ERRORS ==="
            grep -E "error:" build_output.log | while IFS= read -r line; do
              echo "$line"
              # Try to emit as annotation
              FILE_PART=$(echo "$line" | grep -oE "^/[^:]+" | sed 's|.*appsku/||' || true)
              LINE_PART=$(echo "$line" | grep -oE ":[0-9]+:" | head -1 | tr -d ':' || true)
              MSG_PART=$(echo "$line" | sed 's|.*error: ||' | head -c 180 || true)
              if [ -n "$FILE_PART" ] && [ -n "$LINE_PART" ]; then
                echo "::error file=${FILE_PART},line=${LINE_PART}::${MSG_PART}"
              else
                echo "::error::${MSG_PART}"
              fi
            done
            
            echo "=== BUILD FAILED (exit $EXIT_CODE) ==="
          fi
          
          exit $EXIT_CODE

      - name: Package IPA
        if: success()
        working-directory: MetaCalendar
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -1)
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -r MetaCalendar.ipa Payload
          ls -la MetaCalendar.ipa

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MetaCalendar-ipa
          path: MetaCalendar/build/MetaCalendar.ipa
          retention-days: 90

      - name: Create Release on Tag
        if: startsWith(github.ref, 'refs/tags/') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: MetaCalendar/build/MetaCalendar.ipa
          generate_release_notes: true
