name: Build MetaCalendar IPA

on:
  push:
    branches: [main]
    paths:
      - 'MetaCalendar/**'
      - '.github/workflows/build-metacalendar.yml'
    tags: ['metacalendar-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s $(ls -d /Applications/Xcode*.app | head -1)
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: MetaCalendar
        run: xcodegen generate 2>&1

      - name: Build .app (unsigned)
        working-directory: MetaCalendar
        run: |
          set +e
          xcodebuild build             -project MetaCalendar.xcodeproj             -scheme MetaCalendar             -sdk iphoneos             -configuration Release             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             DEVELOPMENT_TEAM="" 2>&1 | tee build_output.log
          EXIT_CODE=${PIPESTATUS[0]}
          
          # Print ALL errors to stdout
          echo "=== BUILD ERRORS ==="
          grep "error:" build_output.log || echo "(no error lines found)"
          echo "=== END ==="
          
          # Also emit annotations
          grep -E "error:" build_output.log | while IFS= read -r line; do
            file=$(echo "$line" | sed 's|^/Users/runner/work/appsku/appsku/||' | cut -d: -f1)
            lineno=$(echo "$line" | cut -d: -f2)
            msg=$(echo "$line" | sed 's|^[^:]*:[0-9]*:[0-9]*: error: ||;s|^[^:]*:[0-9]*: error: ||' | head -c 180)
            echo "::error file=${file},line=${lineno}::${msg}"
          done || true
          
          exit $EXIT_CODE

      - name: Package IPA
        working-directory: MetaCalendar
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -1)
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -r MetaCalendar.ipa Payload
          ls -la MetaCalendar.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaCalendar-ipa
          path: MetaCalendar/build/MetaCalendar.ipa
          retention-days: 90

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: metacalendar-build-log
          path: MetaCalendar/build_output.log
          retention-days: 7

      - name: Create Release on Tag
        if: startsWith(github.ref, 'refs/tags/') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: MetaCalendar/build/MetaCalendar.ipa
          generate_release_notes: true
