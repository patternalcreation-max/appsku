name: Build MetaCalendar IPA

on:
  push:
    branches: [main]
    paths:
      - 'MetaCalendar/**'
      - '.github/workflows/build-metacalendar.yml'
    tags: ['metacalendar-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s $(ls -d /Applications/Xcode*.app | head -1)
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: MetaCalendar
        run: xcodegen generate 2>&1

      - name: Build .app (unsigned)
        working-directory: MetaCalendar
        run: |
          set +e
          xcodebuild build             -project MetaCalendar.xcodeproj             -scheme MetaCalendar             -sdk iphoneos             -configuration Release             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             DEVELOPMENT_TEAM="" 2>&1 | tee build_output.log
          EXIT_CODE=${PIPESTATUS[0]}
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "========== BUILD FAILED =========="
            echo "--- Swift compiler errors ---"
            grep -E "error:" build_output.log | head -30
            echo "--- Last 30 lines of build log ---"
            tail -30 build_output.log
            echo "=================================="
          fi
          
          exit $EXIT_CODE

      - name: Package IPA
        if: success()
        working-directory: MetaCalendar
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -1)
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -r MetaCalendar.ipa Payload
          ls -la MetaCalendar.ipa

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MetaCalendar-ipa
          path: MetaCalendar/build/MetaCalendar.ipa
          retention-days: 90

      - name: Create Release on Tag
        if: startsWith(github.ref, 'refs/tags/') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: MetaCalendar/build/MetaCalendar.ipa
          generate_release_notes: true
