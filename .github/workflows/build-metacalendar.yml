name: Build MetaCalendar IPA

on:
  push:
    branches: [main]
    paths:
      - 'MetaCalendar/**'
      - '.github/workflows/build-metacalendar.yml'
    tags: ['metacalendar-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s $(ls -d /Applications/Xcode*.app | tail -1)
          xcodebuild -version
          xcrun simctl list runtimes || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: MetaCalendar
        run: xcodegen generate 2>&1

      - name: Build .app (unsigned)
        working-directory: MetaCalendar
        run: |
          set +e
          
          xcodebuild build             -project MetaCalendar.xcodeproj             -scheme MetaCalendar             -sdk iphoneos             -configuration Release             -derivedDataPath build             -destination 'generic/platform=iOS'             ARCHS=arm64             ONLY_ACTIVE_ARCH=NO             ASSETCATALOG_COMPILER_SKIP_VALIDATION=YES             ENABLE_BITCODE=NO             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             DEVELOPMENT_TEAM="" 2>&1 | tee build_output.log
          EXIT_CODE=${PIPESTATUS[0]}
          
          # If asset catalog fails, try without it
          if [ $EXIT_CODE -ne 0 ] && grep -q "simulator runtime" build_output.log; then
            echo "=== Asset catalog failed, retrying without Assets.xcassets ==="
            
            # Remove asset catalog from project temporarily
            sed -i '' '/ASSETCATALOG_COMPILER_APPICON_NAME/d' project.yml
            xcodegen generate 2>&1
            
            xcodebuild build               -project MetaCalendar.xcodeproj               -scheme MetaCalendar               -sdk iphoneos               -configuration Release               -derivedDataPath build               -destination 'generic/platform=iOS'               ARCHS=arm64               ONLY_ACTIVE_ARCH=NO               ENABLE_BITCODE=NO               CODE_SIGNING_ALLOWED=NO               CODE_SIGNING_REQUIRED=NO               CODE_SIGN_IDENTITY=""               DEVELOPMENT_TEAM="" 2>&1 | tee build_output2.log
            EXIT_CODE=${PIPESTATUS[0]}
          fi
          
          if [ $EXIT_CODE -ne 0 ]; then
            cd $GITHUB_WORKSPACE
            git stash || true
            git checkout -B build-logs || true
            cp MetaCalendar/build_output.log . 2>/dev/null || true
            cp MetaCalendar/build_output2.log . 2>/dev/null || true
            git add -A
            git -c user.name="github-actions" -c user.email="actions@github.com" commit -m "build log" || true
            git push --force origin build-logs 2>/dev/null || true
            git checkout main || true
          fi
          
          exit $EXIT_CODE

      - name: Package IPA
        if: success()
        working-directory: MetaCalendar
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -1)
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -r MetaCalendar.ipa Payload
          ls -la MetaCalendar.ipa

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MetaCalendar-ipa
          path: MetaCalendar/build/MetaCalendar.ipa
          retention-days: 90

      - name: Create Release on Tag
        if: startsWith(github.ref, 'refs/tags/') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: MetaCalendar/build/MetaCalendar.ipa
          generate_release_notes: true
