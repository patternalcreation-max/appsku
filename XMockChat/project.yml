name: XMockChat
options:
  bundleIdPrefix: com.patternalcreation
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  XMockChat:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_NAME: XMockChat
        PRODUCT_BUNDLE_IDENTIFIER: com.patternalcreation.xmockchat
        MARKETING_VERSION: "2.0.1"
        CURRENT_PROJECT_VERSION: "9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: Mock Chat
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Saves exported chat screenshots to your photo library."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
